name: postgis
services:
  # 1. The Database
  pgdb:
    image: postgis/postgis:17-3.6-alpine
    container_name: pgdb
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adminportal}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - pgdb_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    shm_size: "256mb"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nginx_net

  # 2. Web UI for Database (pgAdmin)
  pgadmin:
    image: dpage/pgadmin4:9
    container_name: pgadmin
    restart: unless-stopped
    depends_on:
      pgdb:
        condition: service_healthy
    environment:
      # Turn on when you want to expose to domain
      # VIRTUAL_HOST: pgadmin.domain.com
      # LETSENCRYPT_HOST: pgadmin.domain.com
      # VIRTUAL_PORT: 80
      # PGADMIN_CONFIG_PROXY_X_FOR_COUNT: 1
      # PGADMIN_CONFIG_PROXY_X_PROTO_COUNT: 1
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-dev@domain.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-adminportal}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - nginx_net

volumes:
  pgdb_data:
  pgadmin_data:

networks:
  nginx_net:
    external: true
