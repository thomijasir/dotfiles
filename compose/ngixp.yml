# Replaces caddy-proxy.yml. Apps join nginx_net_net and set:
#   VIRTUAL_HOST=app.example.com  VIRTUAL_PORT=3000
#   LETSENCRYPT_HOST=app.example.com
# Run: ACME_EMAIL=you@example.com docker compose -f nginx-proxy.yml up -d
# # services:
#   my-app:
#     image: my-app:latest
#     environment:
#       - VIRTUAL_HOST=app.example.com
#       - LETSENCRYPT_HOST=app.example.com
#       - VIRTUAL_PORT=3000
#     networks:
#       - nginx_net
#
# networks:
#   proxy-net:
#     external: true
# DONT Forget create network with trusted proxy
#
# docker network create --subnet 172.30.0.0/24 nginx_net
#
# Basic auth: put a file named exactly like the VIRTUAL_HOST in ./htpasswd,
# then recreate nginx-proxy so it picks the file up:
#   mkdir -p htpasswd
#   printf "admin:$(openssl passwd -apr1 'your-password')\n" > htpasswd/app.example.com
#   docker compose -f nginx-proxy.yml up -d nginx-proxy

services:
  nginx-proxy:
    image: nginxproxy/nginx-proxy:alpine
    container_name: nginx-proxy
    ports:
      - 80:80
      - 443:443
    labels:
      - com.github.nginx-proxy.nginx
    networks:
      - nginx_net
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - certs:/etc/nginx/certs:ro
      - html:/usr/share/nginx/html
      # - ./htpasswd:/etc/nginx/htpasswd:ro
    configs:
      - source: cloudflare_real_ip
        target: /etc/nginx/conf.d/cloudflare.conf
    restart: unless-stopped

  acme-companion:
    image: nginxproxy/acme-companion
    container_name: nginx-proxy-acme
    environment:
      - DEFAULT_EMAIL=${ACME_EMAIL:-dev@domain.com}
    depends_on:
      - nginx-proxy
    networks:
      - nginx_net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - certs:/etc/nginx/certs
      - html:/usr/share/nginx/html
      - acme:/etc/acme.sh
    restart: unless-stopped

networks:
  nginx_net:
    external: true

volumes:
  certs: {}
  html: {}
  acme: {}

configs:
  cloudflare_real_ip:
    content: |
      # Cloudflare IPv4
      set_real_ip_from 173.245.48.0/20;
      set_real_ip_from 103.21.244.0/22;
      set_real_ip_from 103.22.200.0/22;
      set_real_ip_from 103.31.4.0/22;
      set_real_ip_from 141.101.64.0/18;
      set_real_ip_from 108.162.192.0/18;
      set_real_ip_from 190.93.240.0/20;
      set_real_ip_from 188.114.96.0/20;
      set_real_ip_from 197.234.240.0/22;
      set_real_ip_from 198.41.128.0/17;
      set_real_ip_from 162.158.0.0/15;
      set_real_ip_from 104.16.0.0/13;
      set_real_ip_from 104.24.0.0/14;
      set_real_ip_from 172.64.0.0/13;
      set_real_ip_from 131.0.72.0/22;
      # Cloudflare IPv6
      set_real_ip_from 2400:cb00::/32;
      set_real_ip_from 2606:4700::/32;
      set_real_ip_from 2803:f800::/32;
      set_real_ip_from 2405:b500::/32;
      set_real_ip_from 2405:8100::/32;
      set_real_ip_from 2a06:98c0::/29;
      set_real_ip_from 2c0f:f248::/32;
      # Extract real visitor IP from Cloudflare header
      real_ip_header CF-Connecting-IP;
