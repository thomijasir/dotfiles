# ~/.config/kitty/kitty.conf
# Kitty config for a Neovim-centric workflow (macOS + herdr multiplexer)
#
# Keybinding layering (kept conflict-free):
#   nvim  : C-h/j/k/l (splits), M-arrows (resize)
#   herdr : alt+h/j/k/l (panes), alt+[ ] ( ) { } t, alt+1..9
#   kitty : cmd-based bindings only

# ── Font ─────────────────────────────────────────────────────────────
font_family      JetBrainsMonoNerdFont-Regular
bold_font        JetBrainsMonoNerdFont-Bold
italic_font      JetBrainsMonoNerdFont-Italic
bold_italic_font JetBrainsMonoNerdFont-BoldItalic
font_size        15.0

# 0 = no glyph thickening; >0 makes text look heavier/bold
macos_thicken_font 0

# ── Shell / session ──────────────────────────────────────────────────
shell zsh

# ── Window ───────────────────────────────────────────────────────────
remember_window_size  no
initial_window_width  120c
initial_window_height 32c
window_padding_width  12
hide_window_decorations yes
background_opacity     0.96
background_blur        24
confirm_os_window_close 0

# ── Cursor / performance ─────────────────────────────────────────────
cursor_shape beam
cursor_beam_thickness 1.6
cursor_blink_interval 0
repaint_delay    8
input_delay      2
sync_to_monitor  yes

# ── Scrolling ────────────────────────────────────────────────────────
scrollback_lines 10000
scrollback_pager_history_size 100

# ── Mouse / URLs ─────────────────────────────────────────────────────
mouse_hide_while_typing yes
url_style curly
open_url_with default
copy_on_select   yes
strip_trailing_spaces smart

# ── Bell / notifications ─────────────────────────────────────────────
enable_audio_bell no
window_alert_on_bell yes

# ── macOS: Option behaves as Alt ─────────────────────────────────────
# REQUIRED: herdr's alt+... bindings and nvim's <M-...> mappings
# don't work in kitty on macOS without this.
macos_option_as_alt yes

# Note: enable_kitty_keyboard is intentionally left off — forcing the
# kitty keyboard protocol through herdr is unreliable; nvim negotiates
# it itself when the chain supports it.

# ── Keybindings ──────────────────────────────────────────────────────
# macOS-style copy/paste
map cmd+c copy_to_clipboard
map cmd+v paste_from_clipboard

# Quick new tab/window (most window mgmt lives in herdr)
map cmd+t new_tab
map cmd+enter new_window_with_cwd
map cmd+w close_window_with_confirmation

# Navigate kitty windows vim-style with cmd+alt (ctrl/alt+hjkl stay
# free for nvim and herdr respectively)
map cmd+alt+h neighboring_window left
map cmd+alt+j neighboring_window down
map cmd+alt+k neighboring_window up
map cmd+alt+l neighboring_window right

# Scrollback
map shift+page_up   scroll_page_up
map shift+page_down scroll_page_down
map f1 show_scrollback

# Open URLs with hints
map cmd+e open_url_with_hints

# Reload config instantly
map ctrl+cmd+, load_config_file

# ── Tab bar (minimal — tabs/splits mostly live in herdr) ─────────────
tab_bar_edge      bottom
tab_bar_style     separator
tab_bar_margin_height 6.0
active_tab_foreground   #8aadf4
active_tab_font_style   bold
inactive_tab_foreground #6e738d

# ── Catppuccin Macchiato ─────────────────────────────────────────────
# Matches nvim (catppuccin-macchiato) and themes herdr too,
# since herdr's theme = "terminal" inherits these colors.
foreground #cad3f5
background #24273a
selection_foreground #24273a
selection_background #b7bdf8

# Cursor
cursor #f4dbd6
cursor_text_color #24273a

# URLs
url_color #8bd5ca

# Border
active_border_color   #8aadf4
inactive_border_color #494d64
bell_border_color     #eed49f

# Tab bar
tab_bar_background    #1e2030

# The 16 terminal colors
# black
color0  #494d64
color8  #5b6078
# red
color1  #ed8796
color9  #ec7f87
# green
color2  #a6da95
color10 #b9dd9a
# yellow
color3  #eed49f
color11 #f5d78a
# blue
color4  #8aadf4
color12 #8fa9f8
# magenta
color5  #f5bde6
color13 #f0a6dd
# cyan
color6  #8bd5ca
color14 #93d6cb
# white
color7  #b8c0e0
color15 #a5adcb
