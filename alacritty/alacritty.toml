# Alacritty configuration for a Neovim + herdr workflow on macOS.
# Keep terminal-level shortcuts Command-based so Control and Option remain
# available to applications and the multiplexer.

[general]
live_config_reload = true

[window]
padding = { x = 0, y = 0 }
dynamic_padding = false
decorations = "None"
opacity = 0.96
blur = true
dynamic_title = true
option_as_alt = "Both"
startup_mode = "Maximized"

[scrolling]
history = 10_000
multiplier = 3

[font]
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }
bold_italic = { family = "JetBrainsMono Nerd Font", style = "Bold Italic" }
size = 15
builtin_box_drawing = true

[cursor]
style = { shape = "Block", blinking = "On" }
unfocused_hollow = true
thickness = 0.15

[selection]
save_to_clipboard = true

[mouse]
hide_when_typing = true

[terminal]
# Allow terminal applications and remote sessions to copy through OSC 52,
# without granting them access to paste/read the system clipboard.
osc52 = "OnlyCopy"

[hints]
alphabet = "jfkdls;ahgurieowpq"

[[hints.enabled]]
command = "/usr/bin/open"
hyperlinks = true
post_processing = true
persist = false
mouse = { enabled = true, mods = "Command" }
binding = { key = "E", mods = "Command" }
regex = "(ipfs:|ipns:|magnet:|mailto:|gemini://|gopher://|https://|http://|news:|file:|git://|ssh:|ftp://)[^\\u0000-\\u001F\\u007F-\\u009F<>\\\"\\s{-}\\^⟨⟩`\\\\]+"

[keyboard]
bindings = [
  { key = "Enter", mods = "Command", action = "CreateNewWindow" },
  { key = "F1", action = "ToggleViMode" },
]

# Catppuccin Macchiato. Kept inline so this file has no external theme
# dependency and stays visually consistent with the Kitty configuration.
[colors.primary]
background = "#24273a"
foreground = "#cad3f5"
dim_foreground = "#8087a2"
bright_foreground = "#cad3f5"

[colors.cursor]
